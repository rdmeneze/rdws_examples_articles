CONFIG_MAIN_STACK_SIZE=8192
CONFIG_PRINTK=y

# Pico de pilha: k_thread_stack_space_get() precisa da pilha preenchida na partida.
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y

# ECDH P-256 pela API PSA, a mesma que o mbedTLS usa no ECDHE-PSK.
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_ENTROPY_GENERATOR=y

# Heap do mbedTLS com estatísticas, para medir o pico. O firmware usa 16 KB.
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=16384
CONFIG_MBEDTLS_MEMORY_DEBUG=y
